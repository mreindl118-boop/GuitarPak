<title>Sheets, messages and the tour · soundLAB 2.0 drawings</title>
<!--
  soundLAB 2.0 Phase B, step B1b: everything that lies over a page, drawn before it is built
  (docs/plans/phase-b/PLAN.md, table B1b.1; decisions D23, D24, D25, D26; steps B5b, B7a, B7b, B8).

    1  the sheet: a panel on the right (440 px) above 900 px, a bottom sheet at 900 px and below,
       with the real contents of the Metronome sheet (js/metronome.js), the Keyboard lights sheet
       (js/lights.js as it is after B5b: no Help level, no colour switch) and the new Instrument
       sheet (js/learn-instruments.js, D23)
    2  the message stack (D25): one message, two, a long one, also above an open sheet
    3  the pedal's confirmation (#remote-hud, js/remote.js)
    4  the help tour's card and the welcome card (js/help.js, D26)
    5  the empty, loading and error states (.sl-empty, .sl-loading, .error)

  Opened without ?w= it shows every state at 390, 820 and 1280 px, dark and light.
  Opened with ?w= it is one state, laid out for the window it is given.
  The shell, the frames and the shared parameters are mock.js's; the components are mock.css's.
  Read their header comments first.

  THIS DRAWING'S OWN PARAMETERS (beside the shell's: sheet, met, bpm, lights, colors, inst, page, key)
    sheet=metronome   fold=sounds|trainer|all   a fold of the sheet is open
                      sig=4/4|6/8|12/8 …        the time signature: one beat dot per beat
                      met=1                     the click is running (the shell's parameter)
    sheet=lights      lights=scale|off|kbd|none what is connected (the shell's parameter)
                      colors=interval|note      which swatches the sheet shows (the shell's parameter)
                      bt=1                      with lights=none: the Android app is looking for a
                                                Bluetooth keyboard (the loading state of part 5)
    sheet=instrument  inst=piano|guitar|…       the instrument (the shell's parameter)
                      list=1                    the list of instruments, drawn open
                      about=1                   the fold "About instrument categories" is open
                      run=1                     an Exercises run is on: the instrument cannot change
    at=end            the open sheet is scrolled to its end
    msg=<id>[,<id>]   the messages in the stack, from the top down:
                      nothing lock lockoff goal back sound update apk unsaved
    hud=start|nextlesson|back|stop|works        the pedal's confirmation
    tour=welcome|met|bar|lumi|tap               a card of the help tour
    state=empty|error|failed                    the page's content (page=shed for the first two)

  Every text is the app's own, copied from the line named beside it. Where a step of the plan
  rewords a line before this part is built, the text here is that step's wording
  (docs/plans/phase-b/WORDING.md); the script says so line by line. Three texts are new and
  marked "new": the sheet's line "Help level and note colors are in the bar at the top." (B5b,
  in the app's spelling), and the two labels "Practising" and "Where to practise" of the
  Instrument sheet.

  The styles in this file are drawing-only: first what the modules themselves inject in the
  app (decision D8: js/metronome.js, js/lights.js, js/learn-instruments.js, js/remote.js),
  written from tokens as their steps will write it; then what only lays out this drawing (mk-).
  The components (rows in a sheet, the message with its group of buttons, the tour card with
  the X in its first row) are in mock.css.
-->

/* drawing-only */

/* 1 · What the modules inject themselves (D8), as their steps will write it from tokens.
       Not for mock.css: it stays with its module. */

/* ---- js/metronome.js (B7a): the Metronome sheet. Every id of today is kept ---- */
.met-main { display: grid; grid-template-columns: minmax(0, 1fr); justify-items: center; gap: var(--sl-space-4); text-align: center; }
.met-bpmrow { display: flex; align-items: center; justify-content: center; gap: var(--sl-space-2); width: 100%; }
.met-read { display: grid; flex: 1 1 auto; justify-items: center; gap: var(--sl-space-1); min-width: 0; }
#met-bpm-display { min-width: 3ch; }                 /* three digits wide: 99 to 100 BPM never moves the row */
.met-unit {
  color: var(--sl-ink-muted);
  font-family: var(--sl-font-cond);
  font-size: var(--sl-text-xs);
  font-weight: var(--sl-weight-cond);
  line-height: 1;
  letter-spacing: var(--sl-caps-ls);
  text-transform: uppercase;
}
:where(.sl-skin) .btn.met-step { flex: 0 0 auto; width: var(--sl-control-h); padding: 0; font-variant-numeric: tabular-nums; }
.met-wide { width: 100%; }
/* a beat dot is a full-size control; the dot inside it shows accent (a thick ring),
   normal, muted (dashed) and the beat that sounds now (filled and larger) */
.met-dots { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; width: 100%; }
.met-dot {
  display: grid;
  place-items: center;
  width: var(--sl-control-h);
  height: var(--sl-control-h);
  padding: 0;
  border: 0;
  border-radius: var(--sl-radius-pill);
  background: transparent;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.met-dot::before {
  content: '';
  width: var(--sl-space-5);
  height: var(--sl-space-5);
  border: 2px solid var(--sl-line-control);
  border-radius: var(--sl-radius-pill);
  background: var(--sl-surface-2);
  transition: transform var(--sl-dur-fast) var(--sl-ease), background-color var(--sl-dur-fast) var(--sl-ease), border-color var(--sl-dur-fast) var(--sl-ease);
}
@media (hover: hover) { .met-dot:hover::before { border-color: var(--sl-ink-soft); } }
.met-dot.met-acc::before { border: var(--sl-space-1) solid var(--sl-accent-text); background: var(--sl-accent-soft); }
.met-dot.met-mute::before { border-style: dashed; background: transparent; }
.met-dot.met-on::before { border: 2px solid var(--sl-accent-deep); background: var(--sl-accent); transform: scale(1.25); box-shadow: 0 0 var(--sl-space-3) var(--sl-accent-glow-color); }
.met-dot.met-mute.met-on::before { border: 2px solid var(--sl-ink-muted); background: var(--sl-ink-muted); box-shadow: none; }
.met-go { display: flex; gap: var(--sl-space-3); width: 100%; }
:where(.sl-skin) .met-go > .btn { min-height: calc(var(--sl-control-h) + var(--sl-space-3)); }
.met-go > #met-startstop { flex: 1 1 auto; font-size: var(--sl-text-lg); }
.met-go > .met-tap { flex: 0 0 auto; min-width: calc(var(--sl-space-8) + var(--sl-space-5)); touch-action: manipulation; }
.met-opts {
  display: grid;
  grid-template-columns: calc(var(--sl-space-8) + var(--sl-space-5)) minmax(0, 1fr);
  align-items: end;
  gap: var(--sl-space-3) var(--sl-space-4);
  width: 100%;
  text-align: left;
}
.met-opts > .field:last-child { grid-column: 1 / -1; }
#met-vol-val { font-variant-numeric: tabular-nums; }
.met-main + .met-more { margin-top: var(--sl-space-5); }
.met-more > .row { display: grid; grid-template-columns: minmax(0, 1fr); align-items: end; gap: var(--sl-space-3); }
#met-trbox > .row { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.met-check { display: inline-flex; grid-column: 1 / -1; align-items: center; gap: var(--sl-space-3); min-height: var(--sl-control-h); cursor: pointer; }
.met-hint { padding-top: var(--sl-space-4); border-top: 1px solid var(--sl-line-strong); text-align: center; }

/* ---- js/lights.js (B5b, B7a): the Keyboard lights sheet ---- */
.lc-sec { display: grid; gap: var(--sl-space-3); }
.lc-sec + .lc-sec { margin-top: var(--sl-space-5); padding-top: var(--sl-space-5); border-top: 1px solid var(--sl-line-strong); }
.lc-sec > .btn { justify-self: start; }
.lc-status { display: flex; align-items: center; gap: var(--sl-space-2); color: var(--sl-ink); font-size: var(--sl-text-md); font-weight: var(--sl-weight-medium); }
.lc-status::before {                                  /* the dot of the header's status chip: filled = connected */
  content: '';
  flex: 0 0 auto;
  width: var(--sl-space-2);
  height: var(--sl-space-2);
  border: 1px solid var(--sl-line-control);
  border-radius: var(--sl-radius-pill);
}
.lc-status.ok::before { border-color: var(--sl-ok); background: var(--sl-ok); }
.lc-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sl-space-2) var(--sl-space-4); }
.lc-lab { flex: 0 0 auto; min-width: calc(var(--sl-space-8) + var(--sl-space-4)); color: var(--sl-ink-soft); font-size: var(--sl-text-sm); font-weight: var(--sl-weight-medium); }
.lc-degs { display: flex; flex-wrap: wrap; gap: calc(var(--sl-space-1) + 2px); }
.lc-deg { display: grid; justify-items: center; gap: 2px; }
.lc-deg > i {                                         /* top: the colour on screen; bottom: the colour the LUMI shows */
  display: block;
  width: calc(var(--sl-space-5) + var(--sl-space-1));
  height: var(--sl-space-3);
  border-radius: calc(var(--sl-space-1) - 1px);
  background: var(--c);
  box-shadow: inset 0 0 0 1px var(--sl-line-control);
}
.lc-deg > b { margin-top: 2px; color: var(--sl-ink-muted); font-size: var(--sl-text-xs); line-height: 1; }
.lc-notes { gap: var(--sl-space-1); }
.lc-notes .lc-deg > i { width: var(--sl-space-5); }
#lc-bright { flex: 1 1 calc(var(--sl-space-8) * 2); width: auto; min-width: 0; }
.lc-val { min-width: var(--sl-space-7); color: var(--sl-ink); font-size: var(--sl-text-sm); font-variant-numeric: tabular-nums; text-align: right; }
.lc-acts { display: flex; flex-wrap: wrap; gap: var(--sl-space-2); }
.lc-sec > .sl-loading { padding: var(--sl-space-4) 0 0; }

/* ---- js/learn-instruments.js (B8): the Instrument sheet ---- */
#learn-instruments { display: grid; gap: var(--sl-space-4); }
.learn-inst-links { display: grid; gap: var(--sl-space-2); }
.learn-inst-session { display: grid; justify-items: start; gap: var(--sl-space-3); padding: var(--sl-space-3) var(--sl-space-4); border: 1px solid var(--sl-line-control); border-radius: var(--sl-radius-md); background: var(--sl-surface); }
.learn-inst-session:empty { display: none; }
.learn-inst-category { color: var(--sl-accent-text); font-weight: var(--sl-weight-medium); }
#learn-instruments > details.tips { border-bottom: 1px solid var(--sl-line-strong); }

/* ---- js/remote.js (B7b): the pedal's confirmation. Its place (38 % from the top) and its
        width rule are today's (tests/remote.test.js:196-205) ---- */
#remote-hud {
  position: fixed;
  top: 38%;
  left: var(--sl-gutter);
  right: var(--sl-gutter);
  z-index: var(--sl-z-toast);
  display: flex;
  align-items: center;
  gap: var(--sl-space-3);
  box-sizing: border-box;
  width: fit-content;
  max-width: calc(100vw - var(--sl-gutter) * 2);
  margin: 0 auto;
  padding: var(--sl-space-3) var(--sl-space-5);
  border: 2px solid var(--sl-accent-text);
  border-radius: var(--sl-radius-pill);
  background: var(--sl-surface);
  color: var(--sl-ink);
  box-shadow: var(--sl-shadow-2);
  font-family: var(--sl-font-display);
  font-size: clamp(var(--sl-text-xl), 6.4vw, var(--sl-display-sm));
  font-weight: var(--sl-weight-regular);
  line-height: 1.15;
  letter-spacing: 0.04em;
  opacity: 0;
  transform: translateY(-50%) scale(0.96);
  pointer-events: none;
  transition: opacity var(--sl-dur) var(--sl-ease), transform var(--sl-dur) var(--sl-ease);
}
#remote-hud.show { opacity: 1; transform: translateY(-50%) scale(1); }
#remote-hud > .ic { flex: 0 0 auto; color: var(--sl-accent-text); }
#remote-hud > span { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; max-height: 2.4em; overflow: hidden; overflow-wrap: anywhere; text-align: center; }
@media (max-width: 640px) { #remote-hud { border-radius: var(--sl-radius-lg); } }

/* 2 · What only lays out this drawing */

/* the open list of the Instrument select: a real one is drawn by the phone or the computer */
.mk-listbox { display: grid; gap: 2px; margin-top: calc(-1 * var(--sl-space-3)); padding: var(--sl-space-1); border: 1px solid var(--sl-line-control); border-radius: var(--sl-radius-md); background: var(--sl-surface); box-shadow: var(--sl-shadow-2); }
.mk-listbox > span { display: flex; align-items: center; gap: var(--sl-space-2); min-height: calc(var(--sl-space-6) + var(--sl-space-1)); padding: 0 var(--sl-space-3); border-radius: var(--sl-radius-sm); color: var(--sl-ink); font-size: var(--sl-text-md); }
.mk-listbox > span.is-on { background: var(--sl-accent-soft); font-weight: var(--sl-weight-medium); }
.mk-listbox > span > .ic { margin-left: auto; color: var(--sl-accent-text); }
.mk-listbox > span.mk-listbox-group {
  min-height: 0;
  margin-top: var(--sl-space-1);
  padding-top: var(--sl-space-3);
  padding-bottom: var(--sl-space-1);
  border-top: 1px solid var(--sl-line-strong);
  border-radius: 0;
  color: var(--sl-ink-muted);
  font-family: var(--sl-font-cond);
  font-size: var(--sl-text-xs);
  font-weight: var(--sl-weight-cond);
  letter-spacing: var(--sl-caps-ls);
  text-transform: uppercase;
}
.mk-listbox > span.is-in { padding-left: var(--sl-space-5); }

/* a page body for the states of part 5: a headline, a line, a row of tools, cards */
.mk-page { display: grid; align-content: start; gap: var(--sl-space-4); max-width: calc(var(--sl-space-8) * 12); margin: 0 auto; }
.mk-page .card > h2 + p { margin-bottom: var(--sl-space-2); }
</style>

<noscript>This drawing is built by a script (mock.js). Please switch JavaScript on.</noscript>
<script>
(function () {
  'use strict';
  var q = Mock.q, esc = Mock.esc, D = Mock.DATA;
  var TITLE = 'Sheets, messages and the tour · soundLAB 2.0 drawings';

  var icon = Mock.icon;      // every icon is mock.js's (one of them, alert, is new: see there)
  function options(list, selected) {
    return list.map(function (o) { return '<option value="' + esc(o[0]) + '"' + (o[0] === selected ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join('');
  }
  function seg(label, attr, list, on) {      // a segmented control: [value, text] pairs, one of them on
    return '<div class="seg" role="group" aria-label="' + esc(label) + '">' + list.map(function (o) {
      return '<button type="button" ' + attr + '="' + o[0] + '"' + (o[0] === on ? ' class="active"' : '') + ' aria-pressed="' + (o[0] === on) + '">' + esc(o[1]) + '</button>';
    }).join('') + '</div>';
  }

  // ==== 1 · THE SHEETS' BODIES ============================================================

  // ---- Metronome: the markup of js/metronome.js:124-182, id for id. Changed for the new look:
  //      the readout is .sl-readout, the two folds are details.sl-fold, a beat dot is a full-size
  //      control. The texts are the file's own.
  function metronomeBody(o) {
    var sig = /^\d{1,2}\/\d{1,2}$/.test(q('sig', '')) ? q('sig', '') : '4/4', beats = Math.max(1, Math.min(32, parseInt(sig, 10)));
    var fold = q('fold', ''), sounds = fold === 'sounds' || fold === 'all', trainer = fold === 'trainer' || fold === 'all';
    var dots = '';
    for (var i = 0; i < beats; i++) {
      // beat 1 is the accent (js/metronome.js defaultLevels); while it runs the drawing mutes the last
      // beat and lights the third, so that all four looks of a dot are in one picture
      var cls = 'met-dot' + (i === 0 ? ' met-acc' : '') + (o.met && beats > 2 && i === beats - 1 ? ' met-mute' : '') + (o.met && i === Math.min(2, beats - 1) ? ' met-on' : '');
      dots += '<button type="button" class="' + cls + '" title="Beat ' + (i + 1) + ' — click to cycle accent / normal / muted"></button>';
    }
    var SOUNDS = [['beep', 'Beep'], ['wood', 'Woodblock'], ['tick', 'Tick'], ['clave', 'Clave'], ['bell', 'Cowbell']];      // :43
    var SUBDIVS = [['quarter', 'Quarter (beats only)'], ['eighth', 'Eighth'], ['triplet', 'Triplet'], ['sixteenth', 'Sixteenth']];      // :44-49
    // the trainer's line: js/metronome.js:512-530
    var status = !trainer ? 'Off — enable to raise the tempo automatically while the metronome runs.'
      : o.met ? 'Running: +5 BPM in 3 bars (target 160 BPM).' : '+5 BPM every 4 bars until 160 BPM.';
    return '<div class="met-main">' +
      '<div class="met-bpmrow">' +
        '<button class="btn met-step" id="met-m5" type="button" aria-label="5 BPM slower">&minus;5</button>' +
        '<button class="btn met-step" id="met-m1" type="button" aria-label="1 BPM slower">&minus;1</button>' +
        '<div class="met-read"><div class="sl-readout" id="met-bpm-display">' + o.bpm + '</div><div class="met-unit">BPM</div></div>' +
        '<button class="btn met-step" id="met-p1" type="button" aria-label="1 BPM faster">+1</button>' +
        '<button class="btn met-step" id="met-p5" type="button" aria-label="5 BPM faster">+5</button>' +
      '</div>' +
      '<input type="range" id="met-bpm-slider" class="met-wide" min="30" max="280" step="1" value="' + o.bpm + '" aria-label="Tempo">' +
      '<div class="met-dots" id="met-dots" title="Tap a dot: accent / normal / muted">' + dots + '</div>' +
      '<div class="met-go">' +
        '<button class="btn primary" id="met-startstop" type="button">' + (o.met ? 'Stop' : 'Start') + '</button>' +
        '<button class="btn met-tap" id="met-tap" type="button" title="Tap the beat to set the tempo">Tap</button>' +
      '</div>' +
      '<div class="met-opts">' +
        '<label class="field">Time<input type="text" id="met-sig" list="met-sig-list" maxlength="5" autocomplete="off" value="' + esc(sig) + '" ' +
          'title="Type any signature, e.g. 7/16, 11/8, 13/4 — beats over 1, 2, 4, 8, 16 or 32">' +
          '<datalist id="met-sig-list">' + ['2/4', '3/4', '4/4', '5/4', '6/8', '7/8', '9/8', '12/8'].map(function (s) { return '<option value="' + s + '">'; }).join('') + '</datalist></label>' +
        '<label class="field">Subdivision<select id="met-subdiv">' + options(SUBDIVS, 'quarter') + '</select></label>' +
        '<label class="field"><span>Volume <span id="met-vol-val">80</span>%</span><input type="range" id="met-vol" min="0" max="100" step="1" value="80"></label>' +
      '</div>' +
      '<div class="error" id="met-err" hidden></div>' +
      '</div>' +
      '<details class="met-more sl-fold"' + (sounds ? ' open' : '') + '><summary>Click sounds</summary><div class="row met-mt">' +
        '<label class="field">Bar tone (beat 1)<select id="met-snd-acc">' + options(SOUNDS, sounds ? 'bell' : 'beep') + '</select></label>' +
        '<label class="field">Beat tone<select id="met-snd-beat">' + options(SOUNDS, sounds ? 'wood' : 'beep') + '</select></label>' +
        '<label class="field">Upbeat tone<select id="met-snd-sub">' + options(SOUNDS, sounds ? 'tick' : 'beep') + '</select></label>' +
      '</div></details>' +
      '<details class="met-more sl-fold" id="met-trbox"' + (trainer ? ' open' : '') + '><summary>Tempo trainer</summary><div class="row met-mt">' +
        '<label class="met-check"><input type="checkbox" id="met-tr-on"' + (trainer ? ' checked' : '') + '> Enable</label>' +
        '<label class="field">+N BPM<input type="number" id="met-tr-inc" class="met-num" min="1" max="20" step="1" value="5"></label>' +
        '<label class="field">Every M bars<input type="number" id="met-tr-bars" class="met-num" min="1" max="16" step="1" value="4"></label>' +
        '<label class="field">Target BPM<input type="number" id="met-tr-target" class="met-num" min="30" max="280" step="1" value="160"></label>' +
      '</div><div class="muted small met-mt" id="met-tr-status">' + status + '</div></details>' +
      '<p class="muted small met-hint">Space starts and stops it. It keeps playing when you close this.</p>';
  }

  // ---- Keyboard lights: js/lights.js:68-128 as it is after B5b (the Help level and the colour
  //      switch are gone, lines 41-49 and 77-87) and B7a. Reworded by those steps, as
  //      WORDING.md proposes: lines 96 and 116-118 (B5a), 105-108 and 113 (B7a).
  var NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];      // js/lights.js:33
  function lightsBody(o) {
    var kind = o.lights === 'none' ? 'connect' : 'ok', lumi = o.lights === 'scale' || o.lights === 'off', byNote = o.colors === 'note';
    var status = kind === 'connect' ? 'No keyboard connected.' : lumi ? 'ROLI LUMI · playing C3–B4' : 'LED keyboard · playing C3–C8';      // :59, :65-66
    var h = '<div class="lc-sec">' +
      '<p class="muted small">Help level and note colors are in the bar at the top.</p>' +      // new (B5b), in the app's spelling
      '<p class="lc-status ' + kind + '">' + status + '</p>';
    if (kind === 'connect') {
      h += '<button type="button" class="btn sm primary" id="lc-connect">Connect keyboard</button>';
      if (q('bt', '') === '1') {      // the Android app (m.native): its Bluetooth search, js/lights.js:92, :161
        h += '<div class="lc-acts"><button type="button" class="btn sm" id="lc-bt">Find a Bluetooth keyboard</button></div>' +
          '<div class="sl-loading" role="status"><b>Looking for Bluetooth MIDI keyboards…</b></div>';
      }
    } else if (lumi) {
      var sw = byNote ? D.COLORS.NOTES.map(function (c, i) { return { c: c, lab: NOTE_NAMES[i], title: NOTE_NAMES[i] }; })
        : D.COLORS.DEGREES.map(function (c, i) { return { c: c, lab: i ? String(i + 1) : 'R', title: 'Degree ' + (i + 1) }; });
      h += '<p class="muted small">Switch the LUMI lights on and off in the key bar. Brightness and colors are set here.</p>' +      // :96
        '<div class="lc-row"><span class="lc-lab">Colors</span><span class="lc-degs' + (byNote ? ' lc-notes' : '') + '" aria-label="' + (byNote ? 'Note' : 'Scale degree') + ' colors on screen and on the LUMI">' +
          sw.map(function (s) { return '<span class="lc-deg" title="' + s.title + '"><i style="--c:' + s.c + '"></i><i style="--c:' + s.c + '"></i><b>' + s.lab + '</b></span>'; }).join('') + '</span></div>' +
        '<p class="muted small">' + (byNote

  // the ring around the target and the card beside it: the arithmetic of js/help.js:164-213, with
  // the gutter token's 16 px to the window's edges, and the ring kept inside the window
  function placeTour() {
    var ov = document.getElementById('hp-ov'), st = TOURS[q('tour', '')];
    if (!ov || !st) return;
    var ring = ov.querySelector('.hp-ring'), card = ov.querySelector('.hp-card'), rect = null, W = window.innerWidth, H = window.innerHeight;
    var target = st.sel ? document.querySelector(st.sel) : null;
    if (target) {
      var r = target.getBoundingClientRect();
      if (r.width > 0 && r.height > 0 && r.bottom > 0 && r.top < H) rect = r;
    }
    ov.classList.toggle('is-spot', !!rect);
    if (rect) {
      var l = Math.max(4, rect.left - 6), t = Math.max(4, rect.top - 6);
      ring.style.display = '';
      ring.style.left = l + 'px';
      ring.style.top = t + 'px';
      ring.style.width = (Math.min(W - 4, rect.right + 6) - l) + 'px';
      ring.style.height = (Math.min(H - 4, rect.bottom + 6) - t) + 'px';
    } else ring.style.display = 'none';
    card.style.left = '50%';
    card.style.top = '50%';
    card.style.transform = 'translate(-50%,-50%)';
    if (rect) {
      var ch = card.offsetHeight, cw = card.offsetWidth, m = 16;
      var left = Math.max(m, Math.min(W - cw - m, rect.left + rect.width / 2 - cw / 2));
      var top = rect.bottom + 14;
      if (top + ch > H - m) top = rect.top - ch - 14;
      if (top < m) top = Math.max(m, (H - ch) / 2);
      card.style.transform = 'none';
      card.style.left = left + 'px';
      card.style.top = top + 'px';
    }
  }
