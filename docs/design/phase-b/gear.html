<title>soundLAB Gear until its own phase · soundLAB 2.0 drawings</title>
<!--
  soundLAB 2.0 Phase B, step B1b: soundLAB Gear between Phase B and Phase H, drawn before it is built
  (docs/plans/phase-b/PLAN.md, table B1b.1; decisions D13 and D14; "For the owner", item 5).

  WHAT IT SHOWS. Gear's Deck and Hub exactly as they render today, inside the NEW header, with the
  key bar folded behind the header button that names the key (#cx-toggle) and with it open, at 390
  and 1280 px, dark and light. The frame is new and the pages are not: the drawing is there to show
  that honestly. A third group shows the key button with the key the app starts with, at 360, 390
  and 1280 px.

  Opened without ?w= it shows every state at both widths, dark and light.
  Opened with ?w= it is one state, laid out for the window it is given.
  The shell, the frames and the shared parameters are mock.js's; the shell's styles are mock.css's.
  Read their header comments first.

  THIS DRAWING'S OWN PARAMETER (beside the shell's: bar=open, key, bpm, lock, lights, help, pop, theme, touch)
    page=deck|midihub   the saved page. liveset and helix are not saved: a line says so.
  The shell is always Gear's (app=gear cannot be changed here) and starts with lights=off, the
  state the pages were saved in. A tap on the header's key button opens and folds the bar; a tap
  outside the bar, Escape and a change of page fold it, as D14 asks.

  THE KEY BUTTON NEVER BREAKS THE HEADER'S ROW. With the app's own first key, "A Minor Pentatonic",
  a button that always wrote the key's plain name would break Gear's header into two rows at
  390 px, and at 360 px even "A Dorian" would. So up to 900 px the tools give way, not the row
  (mock.css, "The header's width tiers"), and the button takes the longest form of the name that
  fits: the plain name, then the short name, then the short name without the caret (mock.js,
  Mock.settle; the button's aria-label keeps the whole name).

  THE SAVED COPY. The three <template> elements below hold today's pages. Nothing in them is
  written by hand, and nothing in this file's own styles or script reaches into them:
    saved-css       css/style.css and the <style> elements the scripts add to the page (App.injectCSS),
                    in the page's order, each rule in its source text
    saved-deck      #panel-deck, the Deck's first view (Perform)
    saved-midihub   #panel-midihub, the Hub's first view (Deck > Knobs, Yamaha MODX / MONTAGE)
  A saved page is shown in an <iframe srcdoc> of its own (sandboxed: no script can run in it;
  inert: it is a picture). That document carries the old stylesheet with the old variables and
  nothing of tokens.css or mock.css, so the header's tokens cannot restyle the old page and the old
  rules cannot restyle the header. Two rules are added to it and say so: its ground is see-through,
  because the ground under Gear's pages is the new shell's from B6 on (D13), and it does not scroll
  (the frame is made as high as the page).
  THE SAVED COPY IS THE ONE PLACE IN THE DRAWINGS WITH RAW COLOURS AND OLD VARIABLES (colour
  values written out, --accent, --card, …): they are today's page, kept as it is on purpose (D13). The only other raw
  colours under docs/design/phase-b/ are the two palettes' data in mock.js. This file's own
  styles and script, outside the three templates, use tokens only.

  HOW THE COPY WAS TAKEN (2026-11-15, from the app as it is in commit 3232b9f; js/ and css/ are
  those of 0133287). gear.html of the worktree, served locally, in headless Chromium, seeded as the
  returning user of tests/gear.test.js: help.seen, help.done and qz.landed true; midi.wanted true,
  lights.on false, midihub.profile "yamaha"; fake Web MIDI ports "MODX-1" and "LUMI Keys Block ALXJ
  (Bluetooth MIDI IN / OUT)"; app.theme dark or light. The Deck after boot, the Hub after
  App.switchTo('midihub'). Before a panel's markup was read, the live state of its form controls was
  written into attributes (which option is selected, what is checked, the values). The markup was
  the same at 390 and 1280 px and in both themes (in the Hub only the times in the hidden Monitor
  list differed), so one copy serves all four.
  To keep the file small, three things that cannot change the picture were taken out:
    1  the content of every element that is display:none at 390 AND at 1280 px in both themes (the
       element itself stays, so that no sibling rule changes): the Deck 3,463 elements -> 81, the Hub
       4,030 -> 365
    2  data-* attributes that no rule of the stylesheets reads (kept: data-app, data-conf, data-dc,
       data-group, data-theme, data-ui, data-view); there were no script tags and no on* attributes
    3  rules whose selector matches nothing in the two saved panels, under either theme (a state
       such as :hover and a pseudo-element are ignored for that test; print rules, and @keyframes
       that no kept rule names, go too): 715 style rules -> 174. Font files are named from this
       folder (../../../fonts/).
  Checked against the running page at 390 x 844 (touch) and 1280 x 800, dark and light, both pages:
  every box that is drawn (1,600 in all) has the same place and size within 0.02 px and the same 52
  computed styles; the same holds in dark at 360, 641, 700, 820, 900, 1024 and 1920 px (2,800 boxes
  more). Window by window the pictures are equal once the copy sits as far down its document as
  <main> does in the app: six of the eight cases then have no differing pixel, and the Deck at
  390 px has 20 and 24 that differ by one step of 255. Without that, 0.03 to 0.05 % of the pixels
  differ, on rounded corners and on the knobs' arcs, where anti-aliasing moves with the position.
  The pixel comparison used a flat ground of the old colour in both, because today's ground is a
  gradient fixed to the window.

  WHAT A SAVED PAGE DOES NOT DO. Its old rules ask the device whether it has a touch screen
  ((pointer: coarse), (hover: hover)); ?touch=1 only changes the new shell. So in the contact view
  on a desktop a 390 px frame shows the old page with mouse sizes under a shell with touch sizes;
  on a phone both are touch. And it never scrolls sideways: at 360 px today's Hub is 3 px wider
  than the window (its "Synth out" select), which the running app shows as a sideways scroll and
  this frame hides. At 390 px and wider nothing reaches past the window.
-->

.mh-cv h3 {margin:16px 0 8px}
.mh-cv-prog {display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin-top:16px}
.mh-cv-prog .btn {min-height:52px;font-size:16px}
.mh-cv-pnum {display:grid;justify-items:center;gap:2px;min-width:110px}
.mh-cv-pnum b {font:400 44px/1 var(--font-display)}
.mh-cv-acts {justify-content:center;margin-top:12px}
@media (max-width:700px) {
  .mh-knobs {grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .mh-knob svg {width:60px;height:60px}
  .mh-knob.hero svg {width:110px;height:110px}
  .mh-parts button {min-width:34px;height:36px}
}
/* css-synthdeck */
.sdk-now {padding:16px 18px}
.sdk-now-main {display:flex;flex-direction:column;gap:2px;margin-bottom:12px;min-width:0}
.sdk-name {background:none;border:0;padding:0;text-align:left;color:var(--text);font:600 30px/1.1 var(--font-condensed);cursor:pointer;letter-spacing:.2px;overflow-wrap:anywhere;max-width:100%}
@media (hover:hover) {
  .sdk-name:hover {color:var(--accent-ink)}
}
#sdk-nowsub {overflow-wrap:anywhere}
.sdk-now-acts {display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.btn.sdk-big {min-height:52px;font-size:16px;padding:8px 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.sdk-pins {display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.sdk-pins[hidden] {display:none}
.sdk-ldrow {margin-top:6px}
#sdk-ldst {font-size:12.5px;color:var(--muted)}
#sdk-ldst:empty {display:none}
#sdk-native {margin-top:8px}
#sdk-native.info {color:var(--warn)}
.sdk-form {margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card2)}
.seg.sdk-tabs {display:flex;width:100%;margin:0 0 12px;box-sizing:border-box}
.sdk-tabs button {flex:1;min-height:44px;font-size:14px;padding:4px 6px}
.sdk-pagehead {justify-content:space-between;margin-bottom:12px}
.sdk-pageacts {margin-top:12px}
.sdk-slot {display:grid;justify-items:center;align-content:center;gap:4px;min-height:124px;border:1px dashed var(--ctl-border);border-radius:12px;background:transparent;color:var(--muted);font-family:var(--font-body);font-size:12px;cursor:pointer}
@media (hover:hover) {
  .sdk-slot:hover {border-color:var(--accent-line);color:var(--text)}
}
.sdk-picker {margin-top:10px}
@media (pointer:coarse) {
  .mh-knob svg {width:84px;height:84px}
  .mh-knob.hero svg {width:140px;height:140px}
  .mh-knobs {grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}
}
@media (max-width:700px) {
  .sdk-now-acts {grid-template-columns:repeat(2,minmax(0,1fr))}
  .sdk-name {font-size:26px}
}
@media (max-width:400px) {
  .sdk-tabs button {font-size:13px;padding:4px 2px}
}

<noscript>This drawing is built by a script (mock.js). Please switch JavaScript on.</noscript>
<script>
(function () {
  'use strict';
  var TITLE = 'soundLAB Gear until its own phase';
  var SAVED = {
    deck: { label: 'The Deck as it is today. A saved picture: nothing in it can be used.' },
    midihub: { label: 'The Hub as it is today. A saved picture: nothing in it can be used.' }
  };

  if (!Mock.single) {
    Mock.contact({
      title: TITLE,
      lead: [
        '<b>The frame is new, the pages are as today, and for a while the two will not match.</b> ' +
          'Gear gets the new header now; its pages wait for Gear’s own phase. ' +
          'The other choice is to re-colour Gear’s pages now: cheap, but nobody has checked those screens for readability.',
        'This is what gets built unless you say otherwise.',
        'Key, tempo, Scale lock, lights and Help are folded behind one button in the header, the one that names the key. ' +
          'Today they are behind the clef. Folded, a stray touch during a gig cannot switch the Scale lock.',
        'The Deck and the Hub in these pictures are saved copies of today’s pages, taken from the running app with a MODX and a LUMI connected. ' +
          'They are pictures, so nothing in them can be tapped. The header around them can.'
      ],
      widths: [390, 1280],
      groups: [
        { title: '1 · The Deck',
          states: [
            { id: 'deck', title: 'The Deck as it is today, inside the new header. The button that says “A Dorian” holds the key bar.',
              params: { page: 'deck' } },
            { id: 'deck-open', title: 'A tap on that button opens the key bar: the same bar soundLAB has.',
              note: 'It folds again with a tap outside it, with Escape, or when you change the page.', params: { page: 'deck', bar: 'open' } }
          ] },
        { title: '2 · The Hub',
          states: [
            { id: 'hub', title: 'The Hub as it is today, inside the new header.', params: { page: 'midihub' } },
            { id: 'hub-open', title: 'The Hub with the key bar open.', params: { page: 'midihub', bar: 'open' } }
          ] },
        { title: '3 · The button that names the key',
          states: [
            { id: 'key-first', title: 'The key the app starts with, A Minor Pentatonic. On a phone the button says “A Min Pent”, as the key bar does.',
              note: 'The header stays in one row with every key. On the narrowest phone the little arrow goes when the name needs its room.',
              params: { page: 'deck', key: 'A-minorPent' }, widths: [360, 390, 1280] },
            { id: 'key-cut', title: 'Not settled: on the narrowest phone (360 px) five long key names are cut with “…”, here Db Harmonic Minor.',
              note: 'The five are the Harmonic Minor keys of Db, Eb, Gb, Ab and Bb. Up to fourteen names are cut in a touch window just over 640 px wide (641 to about 648 px), where the header’s tools take more room.',
              params: { page: 'deck', key: 'Db-harmonicMinor' }, widths: [360, 641] }
          ] }
      ]
    });
    return;
  }

  // ---- one state: Gear's shell from mock.js, and under it the saved page ---------------
  var P = Mock.params, pageId = Mock.q('page', 'deck');
  if (Mock.DATA.APPS.gear.pages.indexOf(pageId) === -1) pageId = 'deck';
  // the saved copy is read before Mock.page writes the body
  var saved = SAVED[pageId] && document.getElementById('saved-' + pageId);
  var css = document.getElementById('saved-css').content.querySelector('style').textContent;
  var shell = { app: 'gear', page: pageId, lights: 'off', fixed: ['app', 'page'] };
  Mock.page({ title: TITLE + ' · soundLAB 2.0 drawings', shell: shell, main: '' });

  // Mock.page writes a panel that carries .sl-skin. A panel of Gear never does (D13): the saved page takes its place.
  var main = document.querySelector('main');
  if (!saved) {
    main.innerHTML = '<p class="mk-old-none">The ' + Mock.esc(Mock.DATA.PAGE_LABELS[pageId]) + ' page is not drawn here. It keeps today’s look until Gear’s own phase, ' +
      'in the same way as the <a href="' + Mock.esc(go({ page: 'deck' })) + '">Deck</a> and the <a href="' + Mock.esc(go({ page: 'midihub' })) + '">Hub</a>.</p>';
  } else {
    var theme = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
    main.innerHTML = '<div class="mk-old" role="img" aria-label="' + Mock.esc(SAVED[pageId].label) + '">' +
      '<iframe class="mk-old-frame" title="' + Mock.esc(SAVED[pageId].label) + '" sandbox="allow-same-origin" inert tabindex="-1"></iframe></div>';
    var frame = main.querySelector('iframe');
    var fit = function () {
      var doc = frame.contentDocument, old = doc && doc.querySelector('main');
      if (old) frame.style.height = Math.ceil(old.getBoundingClientRect().bottom) + 'px';
    };
    frame.addEventListener('load', function () {
      var doc = frame.contentDocument, old = doc && doc.querySelector('main');
      fit();
      if (!old) return;
      if (doc.fonts && doc.fonts.ready) doc.fonts.ready.then(fit);
      if (window.ResizeObserver) new ResizeObserver(fit).observe(old);
    });
    window.addEventListener('resize', fit);
    // today's document around the panel: <html> with the app's and the theme's attributes, the old stylesheet, <body>, <main>
    frame.srcdoc = '<!doctype html><html lang="en" data-app="gear" data-theme="' + theme + '"><head><meta charset="utf-8"><style>' + css + '</style>' +
      '<style>/* added by the drawing: the ground is the new shell\'s (D13), and the frame is as high as the page */' +
      'html, body { background: transparent !important; } html { overflow: hidden !important; }</style></head>' +
      '<body><main>' + saved.innerHTML + '</main></body></html>';
  }

  // ---- the folded key bar closes as today's dropdown does (D14) --------------------------
  function go(changes) {
    var out = {}, k;
    for (k in P) if (Object.prototype.hasOwnProperty.call(P, k)) out[k] = P[k];
    for (k in changes) if (Object.prototype.hasOwnProperty.call(changes, k)) out[k] = changes[k];
    return Mock.href(out);
  }
  // a change of page folds the bar
  Array.prototype.forEach.call(document.querySelectorAll('[data-go*="page="]'), function (el) {
    el.setAttribute('data-go', el.getAttribute('data-go') + '&bar=');
  });
  // the way to soundLAB leads out of this drawing: here it does nothing
  document.addEventListener('click', function (e) {
    var out = e.target.closest && e.target.closest('#app-switch');
    if (out) { e.preventDefault(); e.stopPropagation(); }
  }, true);
  if (Mock.q('bar', '') === 'open' && !Mock.q('pop', '') && !Mock.q('sheet', '')) {
    document.addEventListener('click', function (e) {
      if (e.target.closest && e.target.closest('.topbar, #ctxbar, .sl-pop, #tabbar-m, [data-go], a')) return;
      location.assign(go({ bar: '' }));
    });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') location.assign(go({ bar: '' })); });
  }
})();
</script>
