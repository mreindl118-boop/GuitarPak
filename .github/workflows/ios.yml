# Builds the native iPad/iPhone app on a GitHub-hosted Mac and uploads an
# UNSIGNED .ipa artifact — no Mac required on your side. Install it by
# sideloading (AltStore / SideStore re-sign it with your Apple ID) or sign
# it properly later with an Apple Developer account.
name: iOS app (unsigned IPA)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # current XcodeGen writes the Xcode 16 project format — make sure the
      # newest installed Xcode is selected before building
      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Bundle web app + generate project
        run: |
          cd ios
          ./sync-web.sh
          xcodegen

      - name: Build (unsigned)
        run: |
          cd ios
          xcodebuild -project GuitarLab.xcodeproj \
            -scheme GuitarLab \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          cd ios
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/GuitarLab.app Payload/
          zip -qry GuitarLab-unsigned.ipa Payload
          ls -la GuitarLab-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: GuitarLab-unsigned-ipa
          path: ios/GuitarLab-unsigned.ipa
          retention-days: 30
