name: Validate soundLAB web release
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare isolated browser test dependency
        run: npm install --prefix "$RUNNER_TEMP/soundlab-checks" --no-audit --no-fund --ignore-scripts playwright@1.62.1
      - name: Validate all web and mock MIDI suites
        shell: bash
        run: |
          export NODE_PATH="$RUNNER_TEMP/soundlab-checks/node_modules"
          export CHROMIUM="$(command -v google-chrome)"
          test -n "$CHROMIUM"
          bash tests/run.sh
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soundlab-web-checks
          path: /tmp/sl-*.out
          if-no-files-found: ignore
