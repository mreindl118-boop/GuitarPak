    <span class="tag">alpha</span>
  </div>
  <nav class="nav" id="tabs">
    <select id="nav-select" aria-label="Go to page"></select>
    <button type="button" class="btn sm" id="space-btn" aria-label="Switch workspace"></button>
    <button type="button" class="btn sm" id="help-btn" aria-label="Help for this page" title="What is this page?"></button>
    <button type="button" class="btn sm" id="settings-btn" aria-label="Settings" title="Settings"></button>
  </nav>
  <div class="ctxbar" id="ctxbar">
    <label class="cx-field">Key<select id="cx-root"></select></label>
    <label class="cx-field">Scale<select id="cx-scale"></select></label>
    <label class="cx-field" id="cx-mode-wrap">Mode<select id="cx-mode"></select></label>
    <label class="cx-field">BPM<input id="cx-bpm" type="number" min="30" max="280" step="1"></label>
    <label class="cx-field">Time<select id="cx-sig"></select></label>
    <button type="button" class="btn sm" id="cx-met" title="Start / stop the metronome (works on every tab)" aria-label="Start or stop the metronome"></button>
    <button type="button" class="btn sm" id="cx-rec" aria-label="Capture what you play into the current song"></button>
    <span id="cx-rec-msg" style="display:none" role="status"></span>
  </div>
</header>
<div id="wipe" aria-hidden="true" style="display:none">
  <svg viewBox="0 0 512 512" width="120" height="120">
    <path d="M118 96 H206 V308 A44 44 0 0 1 118 308 Z M212 96 H300 V372 A44 44 0 0 1 212 372 Z M306 96 H394 V308 A44 44 0 0 1 306 308 Z" fill="#ffab47" opacity="0.9"/>
  </svg>
</div>
<main>
  <section class="panel" id="panel-metronome"></section>
  <section class="panel" id="panel-fretboard"></section>

  <section class="panel" id="panel-chords"></section>

  <section class="panel" id="panel-tuner"></section>
  <section class="panel" id="panel-trainer"></section>
  <section class="panel" id="panel-theory"></section>
  <section class="panel" id="panel-settings"></section>
  <section class="panel" id="panel-song"></section>
  <section class="panel" id="panel-arrange"></section>
  <section class="panel" id="panel-tracks"></section>
  <section class="panel" id="panel-pads"></section>
  <section class="panel" id="panel-ideas"></section>
</main>
<footer class="foot">
  soundLAB alpha &mdash; everything runs locally in your browser. Sound starts after your first click (browser autoplay policy). The Tuner needs microphone permission.
</footer>
